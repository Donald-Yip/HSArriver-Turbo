[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hslegend-arriver"
version = "2026.10.24"
description = "Hearthstone recommendation-driven automation for Windows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click==8.4.2",
    "keyboard==0.13.5",
    "mcp==2.3.0",
    "numpy==2.5.2",
    "opencv_python_headless==4.10.0.84",
    "paddleocr==2.10.0",
    "paddlepaddle==2.6.2",
    "Pillow==12.3.0",
    "psutil==7.2.2",
    "pynput==1.8.2",
    "pywin32==312",
    "Requests==2.34.2",
    "setuptools==84.0.0",
]

[project.scripts]
hslegend-onegame = "hslegend.entrypoints.onegame:main"

[tool.uv]
package = true
# Keep PaddleOCR's transitive OpenCV variants aligned with the direct headless pin.
constraint-dependencies = [
    "opencv-python==4.10.0.84",
    "opencv-contrib-python==4.10.0.84",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
